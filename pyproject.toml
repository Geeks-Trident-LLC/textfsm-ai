[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textfsm_ai"
version = "0.8.0"
description = "AI-powered TextFSM template generator with multi-provider support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "click>=8.1",
    "textfsm>=1.1.0",
    "tomli; python_version < '3.11'",
    "anyask>=0.1.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
]

keywords = [
    "textfsm",
    "network automation",
    "cli parsing",
    "template generator",
    "ai",
    "llm",
    "openai",
    "claude",
    "anthropic",
    "gemini",
    "azure-ai-inference",
    "deepseek",
    "groq",
    "xai",
    "grok",
    "together-ai",
    "fireworks-ai",
    "cerebras",
    "perplexity",
    "openrouter",
    "moonshot",
    "kimi",
    "mistral",
    "bedrock",
    "aws",
    "cohere",
    "vertex ai",
    "gcp",
    "oracle cloud infrastructure",
    "oci",
    "device output parsing",
    "log extraction",
    "structured data extraction",
    "screen scraping",
]

[project.optional-dependencies]
# ------------------------------------------------------------
# Per-provider extras: install only the SDK(s) a given provider needs,
# e.g. `pip install textfsm-ai[anthropic]`. All LLM calls are delegated
# to the `anyask` package (https://github.com/Geeks-Trident-LLC/anyask),
# which owns the actual per-provider SDK clients and its own lazy-import
# registry - installing none of these still gives a fully working
# CLI/API, just no provider can actually generate until its extra (or
# [all]) is installed.
# ------------------------------------------------------------
openai = ["anyask[openai]>=0.1.1"]
deepseek = ["anyask[deepseek]>=0.1.1"]
groq = ["anyask[groq]>=0.1.1"]
xai = ["anyask[xai]>=0.1.1"]
together = ["anyask[together]>=0.1.1"]
fireworks = ["anyask[fireworks]>=0.1.1"]
cerebras = ["anyask[cerebras]>=0.1.1"]
perplexity = ["anyask[perplexity]>=0.1.1"]
openrouter = ["anyask[openrouter]>=0.1.1"]
moonshot = ["anyask[moonshot]>=0.1.1"]
anthropic = ["anyask[anthropic]>=0.1.1"]
gemini = ["anyask[gemini]>=0.1.1"]
vertexai = ["anyask[vertexai]>=0.1.1"]
azure = ["anyask[azure]>=0.1.1"]
mistral = ["anyask[mistral]>=0.1.1"]
bedrock = ["anyask[bedrock]>=0.1.1"]
cohere = ["anyask[cohere]>=0.1.1"]
oci = ["anyask[oci]>=0.1.1"]

# ------------------------------------------------------------
# `all`: every provider SDK. For "just give me everything" or a full
# dev/test environment (combine with `dev` - `pip install -e ".[all,dev]"`).
# ------------------------------------------------------------
all = ["anyask[all]>=0.1.1"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

build = ["build", "twine"]

[project.scripts]
textfsm-ai = "textfsm_ai.cli.top:main"

[project.urls]
Homepage = "https://github.com/Geeks-Trident-LLC/textfsm-ai"
Repository = "https://github.com/Geeks-Trident-LLC/textfsm-ai"
Issues = "https://github.com/Geeks-Trident-LLC/textfsm-ai/issues"
Documentation = "https://geeks-trident-llc.github.io/textfsm-ai/latest/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["textfsm_ai*"]
exclude = ["tests*", "docs*", "examples*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=textfsm_ai --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require real API calls or external services",
]

[tool.coverage.report]
fail_under = 70

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "T100",
]

[tool.ruff.format]
exclude = ["**/*.py"]
